<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#FF6584"/>
    </linearGradient>
    <linearGradient id="noteFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0EAFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>

  <!-- Decorative music notes (subtle, scattered) -->
  <text x="680" y="50" font-family="Arial, sans-serif" font-size="28" fill="white" opacity="0.12" transform="rotate(-15 680 50)">&#9834;</text>
  <text x="720" y="160" font-family="Arial, sans-serif" font-size="22" fill="white" opacity="0.1" transform="rotate(10 720 160)">&#9835;</text>
  <text x="60" y="180" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.08" transform="rotate(-8 60 180)">&#9833;</text>

  <!-- Icon: music note -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="140" height="140" rx="32" fill="rgba(255,255,255,0.15)"/>
    <path d="M62 108c0 8.284-6.716 15-15 15-8.284 0-15-6.716-15-15 0-8.284 6.716-15 15-15 2.762 0 5.355.75 7.578 2.055L54.578 42H99v15H62.578v51c1.62-1.952 3.836-3.358 6.422-4V108z" fill="url(#noteFill)"/>
    <!-- Lyrics lines -->
    <rect x="82" y="68" width="38" height="5" rx="2.5" fill="white" opacity="0.9"/>
    <rect x="82" y="83" width="30" height="5" rx="2.5" fill="white" opacity="0.7"/>
    <rect x="82" y="98" width="35" height="5" rx="2.5" fill="white" opacity="0.5"/>
  </g>

  <!-- Title text -->
  <text x="220" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700" fill="white" letter-spacing="-0.5">YouTube Synced Lyrics</text>

  <!-- Subtitle -->
  <text x="220" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="white" opacity="0.85">Auto-fetched synced lyrics on every music video</text>

  <!-- Feature pills -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600">
    <rect x="220" y="142" width="72" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
    <text x="256" y="158" text-anchor="middle" fill="white" opacity="0.95">LRCLIB</text>

    <rect x="300" y="142" width="68" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
    <text x="334" y="158" text-anchor="middle" fill="white" opacity="0.95">Genius</text>

    <rect x="376" y="142" width="104" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
    <text x="428" y="158" text-anchor="middle" fill="white" opacity="0.95">Manifest V3</text>

    <rect x="488" y="142" width="88" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
    <text x="532" y="158" text-anchor="middle" fill="white" opacity="0.95">TypeScript</text>
  </g>

  <!-- Play bar decoration (bottom) -->
  <rect x="40" y="185" width="720" height="3" rx="1.5" fill="white" opacity="0.12"/>
  <rect x="40" y="185" width="320" height="3" rx="1.5" fill="white" opacity="0.35"/>
  <circle cx="360" cy="186.5" r="5" fill="white" opacity="0.5"/>
</svg>
